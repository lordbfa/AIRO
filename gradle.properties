org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# KSP 2.2.10-2.0.2 still registers generated sources via the legacy kotlin.sourceSets DSL,
# which AGP 9's built-in Kotlin rejects by default (google/ksp#2729). Suppress until KSP ships
# a fix; the generated dirs themselves (ksp/debug/{kotlin,java}) are otherwise unaffected.
android.disallowKotlinSourceSets=false
